spring.application.name=ExamVault
server.port=${PORT:8081}

# Use PostgreSQL in production when SPRING_DATASOURCE_URL is configured.
# H2 remains the local-development fallback.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/examvault;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/db-console
server.servlet.session.timeout=8h
